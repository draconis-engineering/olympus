[package]
name = "olympus"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
tui-big-text = "0.8.9"
tokio = { version = "1.38", features = ["full"] }
btleplug = "0.12.0"
futures = "0.3"
fitparser = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
crossbeam-channel = "0.5"
tempfile = "3.27.0"
