[package]
name = "olympus"
version = "1.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
tui-big-text = "0.8.9"
tokio = { version = "1.38", features = ["full"] }
btleplug = "0.13.0"
futures = "0.3"
fitparser = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27.0"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
xml = "1.4"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
oauth2 = "5.0"
sha2 = "0.10"
base64 = "0.22"
url = "2.5"
